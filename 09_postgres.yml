kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: postgres
  namespace: asset-tracker-ns
  labels:
    app: asset-tracker-postgres

spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-tracker-postgres
  serviceName: postgres
  template:
    metadata:
      labels:
        app: asset-tracker-postgres

    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
        env:
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
               name: asset-tracker-configmap
               key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: asset-tracker-secrets
                key: DB_PASSWORD
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: asset-tracker-configmap
                key: DB_NAME
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "manual"
      resources:
        requests:
          storage: 0.5Gi
